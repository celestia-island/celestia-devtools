name: Commit Message Lint

on:
  workflow_call:
    inputs:
      # Which lane serves this required check. GitHub evaluates a required
      # context as "every check run with this name must be successful" (probed
      # 2026-09-24: a pass alongside a pending or failing duplicate leaves the PR
      # BLOCKED), so the three lanes — hosted / self-hosted farm / CNB-dispatched
      # — can never report at the same time. The lane is picked, not raced.
      # Callers that pass nothing keep the historical hosted behaviour.
      runner:
        description: 'JSON array of runner labels, e.g. ["ubuntu-latest"] or ["self-hosted","linux","x64","local"]'
        required: false
        type: string
        default: '["ubuntu-latest"]'
      lane:
        description: "Human label for logs (hosted / farm / cnb)"
        required: false
        type: string
        default: "hosted"
      # Set when a caller is dispatched (e.g. by CNB) and has no PR payload of
      # its own: the lint then resolves that PR number and lints the same head.
      pr:
        description: "Pull request number to lint (empty on normal events)"
        required: false
        type: string
        default: ""
  pull_request:
    types: [opened, edited, reopened, ready_for_review, synchronize]
  merge_group:
    types: [checks_requested]
  # CNB (or an operator) dispatches this to serve the same single check when the
  # scheduled lane cannot run; `pr` is the pull request number to lint.
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to lint"
        required: true
        type: string
      runner:
        description: 'JSON array of runner labels'
        required: false
        type: string
        default: '["self-hosted","linux","x64","local"]'
      lane:
        description: "Human label for logs"
        required: false
        type: string
        default: "cnb"

jobs:
  lint:
    name: Lint commit messages
    # Fork PRs run no lint here: they need maintainer approval anyway, and a
    # fork's run must not spend shared org runner time on untrusted content.
    # Guard applies both to direct pull_request triggers and to workflow_call
    # callers (github.event then carries the caller's PR payload).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Message lint is a sub-minute, stdlib-only job. Hosted stays the default:
    # provisioning is instant and parallel, and a queued lint check must never
    # hold a PR behind real builds (the 4-VM node-ci pool produced ~1h queues for
    # exactly this check). Private repos draw on the org's monthly included
    # minutes, though, and when that quota fails the hosted lane cannot start at
    # all — so a caller may pin another lane through `runner`, which a repository
    # variable can flip without touching the repo's tree.
    # `inputs` is empty outside workflow_call/dispatch, hence the fallback:
    # a bare pull_request on this repo keeps the hosted default.
    # Lane resolution order: caller input > LINT_RUNNER variable (org/repo;
    # `vars` resolves against the CALLER repository, so one org variable
    # re-lanes every caller at once) > hosted. With the org variable set to
    # the farm labels and visible to private repos only, public repos keep
    # free hosted minutes while private repos stop drawing paid minutes.
    runs-on: ${{ fromJSON(inputs.runner || vars.LINT_RUNNER || '["ubuntu-latest"]') }}
    permissions:
      contents: read
      # The dispatched "Resolve the pull request" step calls
      # gh api .../pulls/N; with only contents:read the GitHub App token
      # answers 403 "Resource not accessible by integration" (observed live on
      # the CNB dispatch path), so the PR lookup needs this grant too.
      pull-requests: read
    steps:
      - name: Lane
        run: echo "commit-message lint served by lane ${{ inputs.lane || vars.LINT_LANE || 'hosted' }} on ${{ join(fromJSON(inputs.runner || vars.LINT_RUNNER || '["ubuntu-latest"]'), ', ') }}"

      - name: Resolve the pull request under a dispatched run
        # pull_request and workflow_call carry the PR payload in the event; a
        # workflow_dispatch does not, so the CNB lane passes the number and the
        # same lint then runs against the same head SHA.
        if: github.event.pull_request == null && inputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: |
          set -o pipefail
          gh api "repos/${{ github.repository }}/pulls/$PR" \
            --jq '{title: .title, head_sha: .head.sha, base_ref: .base.ref, base_sha: .base.sha}' \
            > "$RUNNER_TEMP/pr.json"
          python3 - "$RUNNER_TEMP/pr.json" >> "$GITHUB_ENV" <<'PY'
          import json, sys
          pr = json.load(open(sys.argv[1]))
          print(f"PR_TITLE={pr['title']}")
          print(f"PR_HEAD_SHA={pr['head_sha']}")
          print(f"PR_BASE_REF={pr['base_ref']}")
          print(f"PR_BASE_SHA={pr['base_sha']}")
          PY

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # A dispatched (CNB) run has no PR payload, so it checks out the head
          # SHA resolved above; every other trigger keeps its default ref.
          ref: ${{ github.event_name == 'workflow_dispatch' && env.PR_HEAD_SHA || github.ref }}
        # Defensive: the org self-hosted runner env rewrites
        # github.com/celestia-island/* to local bare mirrors (per-repo
        # exact-prefix rules). Those mirrors may lack fresh PR merge refs
        # (observed "not our ref" failures), so bypass the rewriting and clone
        # straight from github.com — a no-op on hosted runners, which rewrite
        # nothing, but still correct if the job is ever pinned back.
        env:
          GIT_CONFIG_COUNT: "0"

      # No actions/setup-python: the hosted Ubuntu image already ships python3
      # + pip, and the bootstrap below needs nothing more (its last resort is a
      # stdlib-only PYTHONPATH invocation). The python-versions manifest ships
      # no builds for the org's Debian 12 self-hosted nodes, so pulling
      # setup-python in would break those hosts if the job were ever pinned
      # back. The pip step uses the system interpreter with --user +
      # --break-system-packages (PEP 668).

      - name: Ensure celestia-devtools
        # Keep this bootstrap in sync with the identical step in
        # .github/workflows/pr-title-check.yml: a single shared composite action
        # cannot be referenced from a reusable workflow (an
        # `owner/repo/.github/actions/x@master` reference resolves to master, so
        # the action could not be verified in the PR that adds it).
        #
        # Hosted runners start empty, so this step is the real bootstrap now;
        # the command -v branch stays for the org self-hosted nodes (and local
        # runs), which preinstall the CLI via the mirror sync — a forced
        # reinstall there has proven unreliable, so keep the preinstalled
        # binary when present.
        #
        # Fallback chain, each step degrading instead of dying: pip (primary on
        # hosted runners, with the same mirror-rewrite bypass as checkout — a
        # rewritten git+https install stalls ~10min against stale local
        # mirrors) → any pip flavor → a pip-less shallow clone driven
        # through PYTHONPATH (the commit-msg-lint path is stdlib-only).
        # The chosen invocation lands in DT_CMD for the lint steps.
        run: |
          if command -v celestia-devtools >/dev/null 2>&1; then
            echo "celestia-devtools already available: $(command -v celestia-devtools)"
            echo "DT_CMD=celestia-devtools" >> "$GITHUB_ENV"
            exit 0
          fi
          PIP_BIN=""
          if command -v pip >/dev/null 2>&1; then
            PIP_BIN=pip
          elif command -v pip3 >/dev/null 2>&1; then
            PIP_BIN=pip3
          elif python3 -c "import pip" >/dev/null 2>&1; then
            PIP_BIN="python3 -m pip"
          fi
          if [ -n "$PIP_BIN" ]; then
            # Unquoted on purpose: PIP_BIN may be "python3 -m pip".
            # --user drops the console script into ~/.local/bin: put it on PATH
            # for this step and register it for the lint steps below, so an
            # image that leaves ~/.local/bin off PATH cannot silently degrade
            # to the slower clone fallback.
            export PATH="$HOME/.local/bin:$PATH"
            if GIT_CONFIG_COUNT=0 $PIP_BIN install --user --break-system-packages \
                git+https://github.com/celestia-island/celestia-devtools.git@master \
              && command -v celestia-devtools >/dev/null 2>&1; then
              echo "$HOME/.local/bin" >> "$GITHUB_PATH"
              echo "DT_CMD=celestia-devtools" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "pip install unavailable or failed; falling back to the pip-less clone"
          fi
          DT_SRC="$RUNNER_TEMP/celestia-devtools"
          rm -rf "$DT_SRC"
          GIT_CONFIG_COUNT=0 git clone --depth 1 \
            https://github.com/celestia-island/celestia-devtools.git "$DT_SRC"
          if ! PYTHONPATH="$DT_SRC/src" python3 -m celestia_devtools --help >/dev/null 2>&1; then
            echo "pip-less bootstrap failed (python3 missing or clone broken)" >&2
            exit 1
          fi
          echo "PYTHONPATH=$DT_SRC/src" >> "$GITHUB_ENV"
          echo "DT_CMD=python3 -m celestia_devtools" >> "$GITHUB_ENV"

      - name: Lint PR title (squash merge subject)
        # Fires on the repo's own pull_request events, via workflow_call when the
        # CALLER was triggered by a pull_request, and on a dispatched (CNB) run,
        # where the title was resolved from the PR number above. Dependabot PRs
        # are exempt: machine-generated subjects cannot satisfy the rules.
        if: (github.event.pull_request || inputs.pr != '') && github.actor != 'dependabot[bot]'
        env:
          # Passed via env so a user-controlled title is never interpolated
          # into shell syntax (quotes, $() and backticks are inert in env).
          PR_TITLE: ${{ github.event.pull_request.title || env.PR_TITLE }}
        run: |
          set -o pipefail
          [ -n "$(printf '%s' "$PR_TITLE" | tr -d '[:space:]')" ] || { echo "empty PR title"; exit 1; }
          echo "PR title: $PR_TITLE"
          printf '%s\n' "$PR_TITLE" | \
          $DT_CMD commit-msg-lint check --stdin-subjects

      - name: Lint all commits in the PR
        if: (github.event.pull_request || inputs.pr != '') && github.actor != 'dependabot[bot]'
        env:
          # Passed via env: a branch name must never be interpolated into
          # shell syntax (same pattern as PR_TITLE above). BASE_SHA and
          # HEAD_SHA come from the resolved PR payload on a dispatched run.
          BASE_NAME: ${{ github.event.pull_request.base.ref || env.PR_BASE_REF }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || env.PR_BASE_SHA }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || env.PR_HEAD_SHA }}
        run: |
          set -o pipefail
          # The event snapshot of base.sha can go stale after squash merges
          # advance the base branch (the old base commit disappears from
          # history, making `base..head` an invalid range). Resolve the real
          # fork point against the checked-out BASE branch (works for any
          # default-branch name, e.g. master or main), falling back to the
          # snapshot the payload carried.
          BASE_REF="$(git rev-parse --verify -q "origin/${BASE_NAME}" || echo "$BASE_SHA")"
          git fetch --quiet origin "$BASE_REF" 2>/dev/null || true
          MERGE_BASE="$(git merge-base "$BASE_REF" "$HEAD_SHA" 2>/dev/null || echo "$BASE_REF")"
          RANGE="${MERGE_BASE}..${HEAD_SHA}"
          echo "Linting commits in range: $RANGE"
          git log --format='%s' "$RANGE" | \
          $DT_CMD commit-msg-lint check --stdin-subjects

      - name: Lint all new commits on push
        # github.event.before is a 40-hex string on push payloads (inherited by
        # workflow_call callers) and empty otherwise — a universal trigger.
        if: github.event.before
        run: |
          set -o pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="$AFTER"
          else
            # A force-push rewrites the previous head away, so the event's
            # `before` can point at an unreachable commit the checkout does
            # not have (git log then fails with "invalid revision range").
            # The PR-wide lint step above already covers the full PR range
            # with a merge-base fallback, so linting just the new head is a
            # safe degradation for that case.
            if ! git rev-parse --verify -q "$BEFORE" >/dev/null 2>&1; then
              RANGE="$AFTER"
            else
              RANGE="${BEFORE}..${AFTER}"
            fi
          fi
          echo "Linting commits in range: $RANGE"
          git log --format='%s' "$RANGE" | \
          $DT_CMD commit-msg-lint check --stdin-subjects
