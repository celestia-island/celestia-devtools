name: Commit Message Lint

on:
  workflow_call: {}
  pull_request:
    types: [opened, edited, reopened, synchronize]
  merge_group:
    types: [checks_requested]

jobs:
  lint:
    name: Lint commit messages
    # Org convention: real work runs on the org self-hosted runners (hosted
    # provisioning has been observed failing at the org billing tier; the
    # shared node also preinstalls celestia-devtools for fast starts).
    runs-on: [self-hosted, linux, x64, local]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install celestia-devtools
        run: pip install git+https://github.com/celestia-island/celestia-devtools.git@master

      - name: Lint PR title (squash merge subject)
        # Fires on the repo's own pull_request events and, via workflow_call,
        # when the CALLER workflow was triggered by a pull_request (github.event
        # then carries the caller's PR payload).
        if: github.event.pull_request
        env:
          # Passed via env so a user-controlled title is never interpolated
          # into shell syntax (quotes, $() and backticks are inert in env).
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          [ -n "$(printf '%s' "$PR_TITLE" | tr -d '[:space:]')" ] || { echo "empty PR title"; exit 1; }
          echo "PR title: $PR_TITLE"
          printf '%s\n' "$PR_TITLE" | \
          celestia-devtools commit-msg-lint check --stdin-subjects

      - name: Lint all commits in the PR
        if: github.event.pull_request
        run: |
          set -o pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          RANGE="${BASE_SHA}..${HEAD_SHA}"
          echo "Linting commits in range: $RANGE"
          git log --format='%s' "$RANGE" | \
          celestia-devtools commit-msg-lint check --stdin-subjects

      - name: Lint all new commits on push
        # github.event.before is a 40-hex string on push payloads (inherited by
        # workflow_call callers) and empty otherwise — a universal trigger.
        if: github.event.before
        run: |
          set -o pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="$AFTER"
          else
            RANGE="${BEFORE}..${AFTER}"
          fi
          echo "Linting commits in range: $RANGE"
          git log --format='%s' "$RANGE" | \
          celestia-devtools commit-msg-lint check --stdin-subjects
