name: Commit Message Lint

on:
  workflow_call: {}
  pull_request:
    types: [opened, edited, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

jobs:
  lint:
    name: Lint commit messages
    # Fork PRs run no lint here: they need maintainer approval anyway, and a
    # fork's run must not spend shared org runner time on untrusted content.
    # Guard applies both to direct pull_request triggers and to workflow_call
    # callers (github.event then carries the caller's PR payload).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Message lint is a sub-minute, stdlib-only job, so it runs on GitHub-hosted
    # runners instead of the org self-hosted fleet: hosted provisioning is
    # instant and parallel, and a queued lint check must never hold a PR behind
    # real builds (the 4-VM node-ci pool produced ~1h queues for exactly this
    # check). Public repos are free and unlimited; private-repo runs draw on the
    # org's monthly included minutes.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
        # Defensive: the org self-hosted runner env rewrites
        # github.com/celestia-island/* to local bare mirrors (per-repo
        # exact-prefix rules). Those mirrors may lack fresh PR merge refs
        # (observed "not our ref" failures), so bypass the rewriting and clone
        # straight from github.com — a no-op on hosted runners, which rewrite
        # nothing, but still correct if the job is ever pinned back.
        env:
          GIT_CONFIG_COUNT: "0"

      # No actions/setup-python: the hosted Ubuntu image already ships python3
      # + pip, and the bootstrap below needs nothing more (its last resort is a
      # stdlib-only PYTHONPATH invocation). The python-versions manifest ships
      # no builds for the org's Debian 12 self-hosted nodes, so pulling
      # setup-python in would break those hosts if the job were ever pinned
      # back. The pip step uses the system interpreter with --user +
      # --break-system-packages (PEP 668).

      - name: Ensure celestia-devtools
        # Hosted runners start empty, so this step is the real bootstrap now;
        # the command -v branch stays for the org self-hosted nodes (and local
        # runs), which preinstall the CLI via the mirror sync — a forced
        # reinstall there has proven unreliable, so keep the preinstalled
        # binary when present.
        #
        # Fallback chain, each step degrading instead of dying: pip (primary on
        # hosted runners, with the same mirror-rewrite bypass as checkout — a
        # rewritten git+https install stalls ~10min against stale local
        # mirrors) → any pip flavor → a pip-less shallow clone driven
        # through PYTHONPATH (the commit-msg-lint path is stdlib-only).
        # The chosen invocation lands in DT_CMD for the lint steps.
        run: |
          if command -v celestia-devtools >/dev/null 2>&1; then
            echo "celestia-devtools already available: $(command -v celestia-devtools)"
            echo "DT_CMD=celestia-devtools" >> "$GITHUB_ENV"
            exit 0
          fi
          PIP_BIN=""
          if command -v pip >/dev/null 2>&1; then
            PIP_BIN=pip
          elif command -v pip3 >/dev/null 2>&1; then
            PIP_BIN=pip3
          elif python3 -c "import pip" >/dev/null 2>&1; then
            PIP_BIN="python3 -m pip"
          fi
          if [ -n "$PIP_BIN" ]; then
            # Unquoted on purpose: PIP_BIN may be "python3 -m pip".
            # --user drops the console script into ~/.local/bin: put it on PATH
            # for this step and register it for the lint steps below, so an
            # image that leaves ~/.local/bin off PATH cannot silently degrade
            # to the slower clone fallback.
            export PATH="$HOME/.local/bin:$PATH"
            if GIT_CONFIG_COUNT=0 $PIP_BIN install --user --break-system-packages \
                git+https://github.com/celestia-island/celestia-devtools.git@master \
              && command -v celestia-devtools >/dev/null 2>&1; then
              echo "$HOME/.local/bin" >> "$GITHUB_PATH"
              echo "DT_CMD=celestia-devtools" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "pip install unavailable or failed; falling back to the pip-less clone"
          fi
          DT_SRC="$RUNNER_TEMP/celestia-devtools"
          rm -rf "$DT_SRC"
          GIT_CONFIG_COUNT=0 git clone --depth 1 \
            https://github.com/celestia-island/celestia-devtools.git "$DT_SRC"
          if ! PYTHONPATH="$DT_SRC/src" python3 -m celestia_devtools --help >/dev/null 2>&1; then
            echo "pip-less bootstrap failed (python3 missing or clone broken)" >&2
            exit 1
          fi
          echo "PYTHONPATH=$DT_SRC/src" >> "$GITHUB_ENV"
          echo "DT_CMD=python3 -m celestia_devtools" >> "$GITHUB_ENV"

      - name: Lint PR title (squash merge subject)
        # Fires on the repo's own pull_request events and, via workflow_call,
        # when the CALLER workflow was triggered by a pull_request (github.event
        # then carries the caller's PR payload). Dependabot PRs are exempt:
        # machine-generated subjects cannot satisfy the gitmoji/period rules.
        if: github.event.pull_request && github.actor != 'dependabot[bot]'
        env:
          # Passed via env so a user-controlled title is never interpolated
          # into shell syntax (quotes, $() and backticks are inert in env).
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          [ -n "$(printf '%s' "$PR_TITLE" | tr -d '[:space:]')" ] || { echo "empty PR title"; exit 1; }
          echo "PR title: $PR_TITLE"
          printf '%s\n' "$PR_TITLE" | \
          $DT_CMD commit-msg-lint check --stdin-subjects

      - name: Lint all commits in the PR
        if: github.event.pull_request && github.actor != 'dependabot[bot]'
        env:
          # Passed via env: a branch name must never be interpolated into
          # shell syntax (same pattern as PR_TITLE above).
          BASE_NAME: ${{ github.event.pull_request.base.ref }}
        run: |
          set -o pipefail
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          # The event snapshot of base.sha can go stale after squash merges
          # advance the base branch (the old base commit disappears from
          # history, making `base..head` an invalid range). Resolve the real
          # fork point against the checked-out BASE branch (works for any
          # default-branch name, e.g. master or main), falling back to the
          # event snapshot.
          BASE_REF="$(git rev-parse --verify -q "origin/${BASE_NAME}" || echo "${{ github.event.pull_request.base.sha }}")"
          MERGE_BASE="$(git merge-base "$BASE_REF" "$HEAD_SHA" 2>/dev/null || echo "$BASE_REF")"
          RANGE="${MERGE_BASE}..${HEAD_SHA}"
          echo "Linting commits in range: $RANGE"
          git log --format='%s' "$RANGE" | \
          $DT_CMD commit-msg-lint check --stdin-subjects

      - name: Lint all new commits on push
        # github.event.before is a 40-hex string on push payloads (inherited by
        # workflow_call callers) and empty otherwise — a universal trigger.
        if: github.event.before
        run: |
          set -o pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="$AFTER"
          else
            # A force-push rewrites the previous head away, so the event's
            # `before` can point at an unreachable commit the checkout does
            # not have (git log then fails with "invalid revision range").
            # The PR-wide lint step above already covers the full PR range
            # with a merge-base fallback, so linting just the new head is a
            # safe degradation for that case.
            if ! git rev-parse --verify -q "$BEFORE" >/dev/null 2>&1; then
              RANGE="$AFTER"
            else
              RANGE="${BEFORE}..${AFTER}"
            fi
          fi
          echo "Linting commits in range: $RANGE"
          git log --format='%s' "$RANGE" | \
          $DT_CMD commit-msg-lint check --stdin-subjects
