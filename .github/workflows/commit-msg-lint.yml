name: Commit Message Lint

on:
  workflow_call: {}
  pull_request:
    types: [opened, edited, reopened, synchronize]
  merge_group:
    types: [checks_requested]

jobs:
  lint:
    name: Lint commit messages
    # Org convention: real work runs on the org self-hosted runners (hosted
    # provisioning has been observed failing at the org billing tier; the
    # shared node also preinstalls celestia-devtools for fast starts).
    runs-on: [self-hosted, linux, x64, local]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
        # Defensive: the runner env rewrites github.com/celestia-island/* to
        # local bare mirrors (per-repo exact-prefix rules). Mirrors may lack
        # fresh PR merge refs (observed "not our ref" failures), so bypass the
        # rewriting and clone straight from github.com.
        env:
          GIT_CONFIG_COUNT: "0"

      # No actions/setup-python: the python-versions manifest ships no Debian
      # 12 builds, so it fails deterministically on the org's self-hosted
      # runners. Node-1 preinstalls python3 + pip; the pip step below uses the
      # system interpreter with --user + --break-system-packages (PEP 668).

      - name: Ensure celestia-devtools
        # The org runners preinstall the CLI (node-1 convention, kept fresh by
        # the mirror sync); pip is only a fallback for hosts without it. A
        # forced reinstall on every run has proven unreliable on the shared
        # runners, so keep the preinstalled binary when present.
        run: |
          if ! command -v celestia-devtools >/dev/null 2>&1; then
            pip install --user --break-system-packages git+https://github.com/celestia-island/celestia-devtools.git@master
            command -v celestia-devtools >/dev/null 2>&1 || { echo "pip install reported success but the CLI is missing"; exit 1; }
          else
            echo "celestia-devtools already available: $(command -v celestia-devtools)"
          fi

      - name: Lint PR title (squash merge subject)
        # Fires on the repo's own pull_request events and, via workflow_call,
        # when the CALLER workflow was triggered by a pull_request (github.event
        # then carries the caller's PR payload). Dependabot PRs are exempt:
        # machine-generated subjects cannot satisfy the gitmoji/period rules.
        if: github.event.pull_request && github.actor != 'dependabot[bot]'
        env:
          # Passed via env so a user-controlled title is never interpolated
          # into shell syntax (quotes, $() and backticks are inert in env).
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          [ -n "$(printf '%s' "$PR_TITLE" | tr -d '[:space:]')" ] || { echo "empty PR title"; exit 1; }
          echo "PR title: $PR_TITLE"
          printf '%s\n' "$PR_TITLE" | \
          celestia-devtools commit-msg-lint check --stdin-subjects

      - name: Lint all commits in the PR
        if: github.event.pull_request && github.actor != 'dependabot[bot]'
        run: |
          set -o pipefail
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          # The event snapshot of base.sha can go stale after squash merges
          # advance master (the old base commit disappears from history, making
          # `base..head` an invalid range). Resolve the real fork point against
          # the checked-out master instead of trusting the stale snapshot.
          BASE_REF="$(git rev-parse --verify -q origin/master || git rev-parse --verify -q master || git rev-parse --verify -q refs/remotes/origin/master)"
          MERGE_BASE="$(git merge-base "$BASE_REF" "$HEAD_SHA" 2>/dev/null || echo "$BASE_REF")"
          RANGE="${MERGE_BASE}..${HEAD_SHA}"
          echo "Linting commits in range: $RANGE"
          git log --format='%s' "$RANGE" | \
          celestia-devtools commit-msg-lint check --stdin-subjects

      - name: Lint all new commits on push
        # github.event.before is a 40-hex string on push payloads (inherited by
        # workflow_call callers) and empty otherwise — a universal trigger.
        if: github.event.before
        run: |
          set -o pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="$AFTER"
          else
            RANGE="${BEFORE}..${AFTER}"
          fi
          echo "Linting commits in range: $RANGE"
          git log --format='%s' "$RANGE" | \
          celestia-devtools commit-msg-lint check --stdin-subjects
