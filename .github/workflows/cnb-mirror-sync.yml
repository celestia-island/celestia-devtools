# CNB Mirror Sync — keeps the one-way mirrors at cnb.cool/celestia-island/* in sync with GitHub.
#
# This is a DATA-SYNC job per the ci-ops note on sync workflows: it never pushes to GitHub,
# so nothing it produces requires GitHub CI validation.
#
# The sync runs INLINE on this runner (GitHub fetch → direct CNB push). Until 2026-09-27 it
# dispatched a ci_infra api_trigger_sync build on CNB instead — that build burned ~44% of the
# free build pool's 160 monthly core-hours (48 runs/day × 4 cpu × ~45 s), which is what kept
# the pool pegged at its 70% gate and deferred cargo spill fallbacks all month. Running inline
# costs CNB nothing; the runner reaches github.com through the daemon proxy (env) and cnb.cool
# directly (scoped no_proxy — through the proxy it crawls), both already-proven paths on the
# SYNC_RUNNER lane. The legacy ci_infra pipeline stays available for manual API dispatch, and
# GH_READ_PAT now never leaves the runner's env at all.
#
# Head pruning is explicit and time-gated: spill/<sha> refs on a mirror are live dispatcher
# traffic while fresh (the spill retry TTL is 45 min, so a 2-hour gate covers re-offers); a
# bulk `push --prune` is never used because it would also delete fresh spill refs this clone
# has never seen. Overlap is prevented by the workflow-level concurrency group.

name: CNB Mirror Sync

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: cnb-mirror-sync
  cancel-in-progress: false

jobs:
  sync:
    # Lane escape hatch, same pattern as the lint callee's runner resolution:
    # the farm labels stay the default, and an operator can re-lane the sync
    # through the SYNC_RUNNER repository variable without a tree edit. `vars`
    # resolves against THIS repository (celestia-devtools), so the flip is
    # local to the sync and re-lands nothing else. The standing configuration
    # since 2026-09-26 is the dispatcher node's labels — the farm's
    # queue-cancel loop starved three scheduled syncs in a row before that.
    runs-on: ${{ fromJSON(vars.SYNC_RUNNER || '["self-hosted","linux","x64","local"]') }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Sync the mirrors inline (GitHub fetch → direct CNB push)
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          GH_READ_PAT: ${{ secrets.GH_READ_PAT }}
          # cnb.cool must go DIRECT (the daemon proxy serves it at ~13KB/s);
          # github.com keeps riding the env proxy. Scoped no_proxy splits the
          # two paths; GIT_CONFIG_COUNT=0 below bypasses only the runner's
          # insteadOf rewrite to stale local bare mirrors.
          NO_PROXY: cnb.cool,api.cnb.cool
        run: |
          set -u
          # Curl lets a lowercase no_proxy (if a runner .env ever sets one)
          # take precedence over the step's uppercase NO_PROXY — mirror it so
          # the direct-CNB path cannot be silently re-proxied.
          export no_proxy="$NO_PROXY"
          REPOS="shittim-chest entelecheia arona malkuth plana hikari kirino evernight celestia-devtools evernight-appliance celestia-integration akivili hifumi cherino kei noa yuuka"
          BASE="${RUNNER_TEMP:-/tmp}/cnb-mirrors"
          mkdir -p "$BASE"
          fail=0
          # The 2h gate below must stay ABOVE the dispatcher's reuse window:
          # SPILL_TTL_SEC + RECENT_TTL_SEC (default 2700s each, env-tunable up
          # to 86400) — raising either knob toward its cap silently shrinks
          # this gate's margin. 2h = 2700s + 2700s + 30min slack.
          cutoff=$(date -d '2 hours ago' +%s)
          for r in $REPOS; do
            m="$BASE/$r.git"
            gh_url="https://langyo:${GH_READ_PAT}@github.com/celestia-island/$r.git"
            cnb_url="https://cnb:${CNB_TOKEN}@cnb.cool/celestia-island/$r.git"
            # Seed the bare clone from the CNB mirror (direct, fast); fall back
            # to GitHub for a repo the mirror does not carry yet. The seed URL
            # carries credentials, so the origin remote is removed right after
            # (every later op passes its URL explicitly and never reads the
            # config) — no token then persists in .git/config across runs.
            if [ ! -d "$m" ]; then
              timeout 300 env GIT_CONFIG_COUNT=0 git clone -q --bare "$cnb_url" "$m" 2>/dev/null \
                || timeout 300 env GIT_CONFIG_COUNT=0 git clone -q --bare "$gh_url" "$m" 2>/dev/null \
                || { echo "$r: CLONE_FAIL"; fail=1; continue; }
              git -C "$m" remote remove origin 2>/dev/null || true
            fi
            # Refresh the mirror's heads into the local view so the age-gate
            # sees spill refs created after this clone was seeded (without
            # this, a persistent RUNNER_TEMP freezes pruning at the seed
            # state). Tolerated on failure — the gate then runs on the older
            # view, exactly the pre-fetch behaviour.
            timeout 120 env GIT_CONFIG_COUNT=0 git -C "$m" fetch -q "$cnb_url" \
              '+refs/heads/*:refs/heads/*' 2>/dev/null || true
            if ! timeout 240 env GIT_CONFIG_COUNT=0 git -C "$m" fetch -q "$gh_url" \
                 '+refs/heads/master:refs/heads/master' '+refs/tags/*:refs/tags/*' 2>/dev/null; then
              echo "$r: FETCH_FAIL"; fail=1; continue
            fi
            # Explicit, time-gated head pruning (see header): local delete then
            # a per-ref remote delete; a rejected remote delete is tolerated
            # (the ref may already be gone on the mirror).
            stale=$(GIT_CONFIG_COUNT=0 git -C "$m" for-each-ref \
              --format='%(refname) %(committerdate:unix)' refs/heads \
              | awk -v c="$cutoff" '$1 != "refs/heads/master" && $2 < c {print $1}')
            for ref in $stale; do
              git -C "$m" update-ref -d "$ref"
              timeout 120 env GIT_CONFIG_COUNT=0 git -C "$m" push -q "$cnb_url" --delete "$ref" 2>/dev/null \
                || echo "$r: stale-ref delete rejected ($ref) — tolerated"
            done
            if ! timeout 240 env GIT_CONFIG_COUNT=0 git -C "$m" push -q "$cnb_url" \
                 '+refs/heads/master:refs/heads/master' '+refs/tags/*:refs/tags/*' 2>/dev/null; then
              echo "$r: PUSH_FAIL"; fail=1; continue
            fi
            local_master=$(git -C "$m" rev-parse refs/heads/master 2>/dev/null || echo none)
            if [ "$local_master" != "none" ] \
               && timeout 120 env GIT_CONFIG_COUNT=0 git ls-remote "$cnb_url" refs/heads/master 2>/dev/null | grep -q "$local_master"; then
              echo "$r: OK ${local_master:0:10}"
            else
              echo "$r: MASTER_MISMATCH"; fail=1
            fi
          done
          echo "SYNC_DONE fail=$fail"
          exit $fail
