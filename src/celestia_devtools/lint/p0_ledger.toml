# P0 ledger — the machine-readable registry of unresolved P0 findings.
#
# Why this file exists: the 2026-09-10 workspace audit
# (_reports/project-group-evaluation-2026-09-10.md) listed five P0s, but their
# only carrier was a markdown report nobody was obliged to read — bypassing
# them cost nothing. `celestia-devtools p0-gate` reads this ledger and fails
# for any repo covered by an entry whose status is still "open", so an
# unresolved P0 now blocks the repos it touches until someone either closes
# the entry (closed_by = the PR that did it) or writes an explicit
# acknowledgment: `--ack P0-X`, `$CELESTIA_P0_ACK`, or a `P0-ACK: P0-X` line
# in the PR body.
#
# Schema — validated by celestia_devtools.lint.p0_gate; a missing, unreadable,
# unparsable or schema-invalid ledger is an error, never a silent pass:
#   id         stable identifier, unique (e.g. "P0-A")
#   title      one-line description of the finding
#   severity   "p0" | "p1"
#   scope      repo names the finding covers; fnmatch patterns allowed
#              (e.g. "easy-hydro-*") because some findings span a repo family
#   status     "open" | "closed"
#   opened_at  ISO date the finding was recorded (YYYY-MM-DD)
#   closed_by  PR reference that closed it ("" while open, non-empty once closed)
#   evidence   one line of review evidence for the current status
#
# Initial content = PLAN.md §1.2 item 18 (the 2026-09-13 backfill of the audit).
# Current rows (2026-09-13, latest revision): P0-A and P0-B stay OPEN — #285
# implements the read-back and the endpoint policy, but a second-round review
# found the read-back unbound to the slave it verifies (unit id / TID / PID /
# ack range) and the endpoint binding inert, so closing either would be a false
# close; P0-C is closed by langyo/easy-hydro-miniprogram#27 (secret rotation
# still pends the user); P0-D is closed by celestia-island/entelecheia#284;
# P0-E stays open, scoped to evernight, after its original master-CI numbers
# turned out to be measured on rewritten commits (AGENTS §8.3.7).
#
# closed_by convention: <owner>/<repo>#<number>.

version = 1
updated_at = "2026-09-13"
source = "_reports/project-group-evaluation-2026-09-10.md (backfilled as PLAN.md §1.2 item 18)"

[[p0]]
id = "P0-A"
title = "Modbus TCP writes are confirmed by the echoed function code only, with no write-then-read-back"
severity = "p0"
scope = ["entelecheia"]
status = "closed"
opened_at = "2026-09-10"
closed_by = "celestia-island/entelecheia#285"
evidence = "2026-09-14: CLOSED by celestia-island/entelecheia#285 (squash 4a3668f). Every guard the previous evidence asked for landed WITH discriminating tests, and three independent adversarial rounds could not break them: each response is envelope-checked against the addressed slave (protocol id 0, our transaction id, unit id == station), the 12-byte acknowledgement must echo the requested start+count, reads are frame-bounded (0 and >254 rejected fast, 254 accepted as the legal boundary), the read-back is compared element-wise over the full range and fails closed on mismatch/truncation/exception/mute/timeout, and the write and its read-back share ONE TCP connection (a test asserts the accept count is 1). Mutation evidence: every guard mutated across those rounds turned a named test red (12/12 then 13/13), with sha-verified restores. Raw byte-level socket shapes the author's harness cannot produce were tested independently: a frame split across 4 TCP segments still confirms, two coalesced frames do NOT desync the read-back, and an unsolicited frame ahead of the acknowledgement is refused. The RTU path's read-back was read in the pinned evernight source (0.3.4 @ 3817643d), not taken on trust."

[[p0]]
id = "P0-B"
title = "Industrial write approval is not bound to a device endpoint, so an approved (station, address) can be replayed at any IP"
severity = "p0"
scope = ["entelecheia"]
status = "closed"
opened_at = "2026-09-10"
closed_by = "celestia-island/entelecheia#285"
evidence = "2026-09-14: CLOSED by celestia-island/entelecheia#285 (squash 4a3668f). Four independent adversarial rounds each found a real bypass and each was killed: (a) the singular register_type \"coil\" was gated as a HOLDING address while the executor wrote a coil (fc15) at the same numeric address; (b) a grant's coverage was widened into a client-supplied register range; (c) one approved address authorised a whole register BLOCK (approving HR:40020 authorised 40020..40024); (d) the value binding was inert end-to-end because no producer ever sent the value. What landed: a shared write_addressing used by BOTH the gate and the executor (the gate walks every address of the block, each whitelisted for its own value and alarm-checked; the executor derives start/count from the same value and refuses a payload whose length differs from the authorised span), endpoint binding enforced at write time, and approvals pinned to the value the dialog showed (proposed_value) - verified by driving chest's real dialog payload through the real resolver and gate (1 allowed, 60000 denied ValueOutOfBounds). RESIDUALS recorded deliberately so that closing is not a claim of perfection: (1) \"refusal before any I/O\" holds per write entry, not per batch - no unauthorised write results, and the scepter whitelist gate remains all-or-nothing, but earlier entries of a batch have already been written; (2) the per-entry alignment refusal has no discriminating test (the invariant holds by construction over 523 scanned shapes); (3) industrial.approveWrite still has no per-connection authorization beyond the shared handshake token - PRE-EXISTING and UNPROVEN, so if any WS client can send it the operator consent is self-approvable; (4) 911 of 934 scepter lib tests need PostgreSQL and were never run, and no live agent->chest->scepter flow was exercised; (5) chest's dialog still has no UI control bound to adjustedValue, so an operator cannot actually edit a value today - the approval binds what the dialog DISPLAYS; (6) there is no TTL on pending approvals."

