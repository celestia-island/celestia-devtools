# P0 ledger — the machine-readable registry of unresolved P0 findings.
#
# Why this file exists: the 2026-09-10 workspace audit
# (_reports/project-group-evaluation-2026-09-10.md) listed five P0s, but their
# only carrier was a markdown report nobody was obliged to read — bypassing
# them cost nothing. `celestia-devtools p0-gate` reads this ledger and fails
# for any repo covered by an entry whose status is still "open", so an
# unresolved P0 now blocks the repos it touches until someone either closes
# the entry (closed_by = the PR that did it) or writes an explicit
# acknowledgment: `--ack P0-X`, `$CELESTIA_P0_ACK`, or a `P0-ACK: P0-X` line
# in the PR body.
#
# Schema — validated by celestia_devtools.lint.p0_gate; a missing, unreadable,
# unparsable or schema-invalid ledger is an error, never a silent pass:
#   id         stable identifier, unique (e.g. "P0-A")
#   title      one-line description of the finding
#   severity   "p0" | "p1"
#   scope      repo names the finding covers; fnmatch patterns allowed
#              (e.g. "easy-hydro-*") because some findings span a repo family
#   status     "open" | "closed"
#   opened_at  ISO date the finding was recorded (YYYY-MM-DD)
#   closed_by  PR reference that closed it ("" while open, non-empty once closed)
#   evidence   one line of review evidence for the current status
#
# Initial content = PLAN.md §1.2 item 18 (the 2026-09-13 backfill of the audit),
# rows P0-A…P0-E with that table's statuses. All five were still open as of the
# 2026-09-13 review; none carries a closing PR yet.

