[build-system]
requires = ["hatchling>=1"]
build-backend = "hatchling.build"

[project]
name = "celestia-devtools"
dynamic = ["version"]
description = "Shared build/devtool scripts for the celestia-island ecosystem"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    # profile write path (read side is stdlib tomllib); zero transitive deps
    "tomli-w>=1",
    # deploy wizard prompts; pure Python (prompt_toolkit + wcwidth)
    "questionary>=2",
    # celestia-ci-audit composes the workflow AST: the composer both proves the file is
    # parseable (its `yaml-parse-error` rule reports what it cannot parse instead of
    # skipping it) and supplies the node line numbers. The job-timeouts tests also use it.
    "PyYAML>=6",
]
authors = [{ name = "langyo", email = "langyo.china@gmail.com" }]
keywords = ["cargo", "devtools", "build-tools", "celestia-island"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/celestia-island/celestia-devtools"
Repository = "https://github.com/celestia-island/celestia-devtools"

[project.scripts]
celestia-devtools = "celestia_devtools.core.cli:main"
cargo-cache-guard = "celestia_devtools.build.cache_guard:main"
format-markdown = "celestia_devtools.doc.markdown:main"
celestia-prefetch = "celestia_devtools.build.prefetch:main"
check-cross-deps = "celestia_devtools.build.cross_deps:main"
celestia-npm-dist = "celestia_devtools.npm.dist:main"
celestia-preflight = "celestia_devtools.env.preflight:main"
celestia-wsl-ensure = "celestia_devtools.env.wsl:main"
celestia-pglite = "celestia_devtools.env.pglite:main"
commit-msg-lint = "celestia_devtools.vcs.commit_msg:main"
publish-crates = "celestia_devtools.publish.crates:main"
release-notes = "celestia_devtools.publish.release_notes:main"
lint-separators = "celestia_devtools.lint.separator_lint:main"
celestia-type-escapes = "celestia_devtools.lint.type_escapes:main"
celestia-ts-policy = "celestia_devtools.lint.ts_policy:main"
celestia-ts-surface = "celestia_devtools.lint.ts_surface:main"
py-style = "celestia_devtools.lint.py_style:main"
cpp-style = "celestia_devtools.lint.cpp_style:main"
p0-gate = "celestia_devtools.lint.p0_gate:main"
celestia-rules-lint = "celestia_devtools.lint.rules_lint:main"
celestia-job-timeouts = "celestia_devtools.ci.job_timeouts:main"
celestia-ci-audit = "celestia_devtools.ci.workflow_audit:main"
celestia-ci-cache = "celestia_devtools.ci.cache_policy:main"

[project.optional-dependencies]
# pytest + ruff only: PyYAML now ships as a runtime dependency (see above), which is also
# what the job-timeouts tests need for their "still valid YAML" cross-checks.
dev = ["pytest>=7", "ruff>=0.4"]

[tool.hatch.version]
# Single source of truth for the package version: the wheel/sdist metadata
# derives from src/celestia_devtools/__init__.py, so the two can never drift
# (they used to: 0.9.0 vs 0.14.1). Guarded by tests/test_version_single_source.py.
path = "src/celestia_devtools/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/celestia_devtools"]

[tool.hatch.build.targets.wheel.force-include]
"src/celestia_devtools/common.just" = "celestia_devtools/common.just"
"src/celestia_devtools/lint/p0_ledger.toml" = "celestia_devtools/lint/p0_ledger.toml"
"src/celestia_devtools/lint/ts_policy.toml" = "celestia_devtools/lint/ts_policy.toml"
"src/celestia_devtools/repo/family_layers.toml" = "celestia_devtools/repo/family_layers.toml"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

# Style policy: the custom layout conventions are enforced by the handwritten
# `py-style` checker (see [tool.py_style]); ruff keeps the stable semantic checks
# only. Preview rules stay disabled: they drift between releases, and the ones
# that would police whitespace encode the OPPOSITE conventions (E251 wants no
# spaces around keyword/default `=`, E301/E302/E305 want two blank lines, W292
# always wants a final newline, W391 is preview-only). The list below is the
# explicit ignore contract, kept even while preview is off, so accidentally
# enabling preview cannot silently contradict the checker.
#
# UP007/UP045 (2026-10-31) pin the PEP 604 annotation style — `X | None`, never
# `Optional[X]` — after the 179-site unification. They are stable (non-preview)
# semantic checks, not whitespace, so they belong to ruff's half of the contract.
# pyshim.py is exempt by grammar, not by config: it is held to Python 3.6 syntax
# where `|` unions do not exist, and it uses no Optional annotations at all.
[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP007", "UP045"]
ignore = [
    "E501",
    "E111",
    "E117",
    "E251",
    "E252",
    "E301",
    "E302",
    "E303",
    "E304",
    "E305",
    "E306",
    "W391",
]

# This repository is fully migrated to the custom layout conventions: the
# handwritten checker (not a formatter) is the authority, and `gate python` plus
# CI run it as a blocking step. The keys below pin the interpretation choices.
[tool.py_style]
docstrings = "allow"
# unittest-style callback names inherited from the framework (lowercase "do_HEAD"
# is the contract, not a local naming choice).
framework_callbacks = ["do_HEAD"]
slice_colons = "pep8"
final_newline = "one"
blank_line_scope = "all"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The style requires lower_snake class names, including test classes, so pytest
# must collect both the legacy `Test*` spelling (third-party patterns) and
# `test_*` (the migrated spelling).
python_classes = ["Test*", "test_*"]
